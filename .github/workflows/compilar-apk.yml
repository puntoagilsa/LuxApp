name: Compilar LuxCam Studio 5.1.3 - visor horizontal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API 34
        run: sdkmanager --install 'platforms;android-34' 'build-tools;35.0.0'

      - name: Aplicar proyecto completo 5.1.1
        shell: bash
        run: |
          test -f LuxCam_Studio_v5_1_1_BUNDLE_COMPLETO_RAIZ_GITHUB.zip
          unzip -oq LuxCam_Studio_v5_1_1_BUNDLE_COMPLETO_RAIZ_GITHUB.zip -d .
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxCamActivity.java
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/OrientationMath.java
          test -f Camera2Diagnostico/checks/OrientationMathCheck.java

      - name: Corregir crash TextureView en ambas orientaciones
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          pattern = re.compile(r'(<TextureView\b[^>]*?)\s+android:background="[^"]*"([^>]*?/>)', re.S)
          android_bg = '{http://schemas.android.com/apk/res/android}background'
          for folder in ('layout', 'layout-land'):
              p = Path('Camera2Diagnostico/app/src/main/res') / folder / 'activity_luxcam_studio.xml'
              original = p.read_text(encoding='utf-8')
              fixed, changed = pattern.subn(r'\1\2', original)
              if changed != 1:
                  raise SystemExit(f'Esperaba corregir 1 TextureView en {p}, encontre {changed}')
              root = ET.fromstring(fixed)
              views = [element for element in root.iter() if element.tag == 'TextureView']
              if len(views) != 1 or android_bg in views[0].attrib:
                  raise SystemExit(f'TextureView invalido en {p}')
              p.write_text(fixed, encoding='utf-8')
              print(f'OK: eliminado background incompatible de {p}')
          PY

      - name: Reparar solo TextureView horizontal (5.1.3)
        shell: bash
        run: |
          test -f LuxCam_Studio_v5_1_3_FIX_PREVIEW_GITHUB.zip
          unzip -oq LuxCam_Studio_v5_1_3_FIX_PREVIEW_GITHUB.zip -d .
          grep -q '5.1.3: On X678B' Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxCamActivity.java
          echo 'Transformacion horizontal aplicada. JPEG y MediaRecorder se mantienen intactos.'

      - name: Comprobar calculos de orientacion
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/luxcam-tests"
          javac -d "$RUNNER_TEMP/luxcam-tests" \
            Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/OrientationMath.java \
            Camera2Diagnostico/checks/OrientationMathCheck.java
          java -cp "$RUNNER_TEMP/luxcam-tests" com.altoke.camera2diagnostico.OrientationMathCheck

      - name: Compilar APK Android
        working-directory: Camera2Diagnostico
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxCam-Studio-v5.1.3-APK
          path: Camera2Diagnostico/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
