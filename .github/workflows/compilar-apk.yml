name: Compilar LuxCam Pro 5.2 - LUTs Camera2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar herramientas Android
        uses: android-actions/setup-android@v4

      - name: Instalar plataforma de Android 14
        run: sdkmanager --install 'platforms;android-34' 'build-tools;35.0.0'

      - name: Extraer proyecto completo 5.2
        shell: bash
        run: |
          set -euo pipefail
          test -f LuxCam_Pro_5_2_PROYECTO_PARA_GITHUB.zip
          unzip -oq LuxCam_Pro_5_2_PROYECTO_PARA_GITHUB.zip -d .
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxCamActivity.java
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxToneCurves.java
          test -f Camera2Diagnostico/checks/LuxToneCurvesCheck.java

      - name: Validar interfaz sin el antiguo crash TextureView
        shell: bash
        run: |
          python3 - <<'PYXML'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          android_bg = '{http://schemas.android.com/apk/res/android}background'
          for folder in ('layout', 'layout-land'):
              path = Path('Camera2Diagnostico/app/src/main/res') / folder / 'activity_luxcam_studio.xml'
              root = ET.parse(path).getroot()
              previews = [v for v in root.iter() if v.tag == 'TextureView']
              assert len(previews) == 1 and android_bg not in previews[0].attrib, path
              print('OK visor XML', path)
          PYXML

      - name: Pruebas de curvas LUT y orientación Java
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luxcam-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/luxcam-tests" \
            Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxToneCurves.java \
            Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/OrientationMath.java \
            Camera2Diagnostico/checks/LuxToneCurvesCheck.java \
            Camera2Diagnostico/checks/OrientationMathCheck.java
          java -cp "$RUNNER_TEMP/luxcam-tests" com.altoke.camera2diagnostico.LuxToneCurvesCheck
          java -cp "$RUNNER_TEMP/luxcam-tests" com.altoke.camera2diagnostico.OrientationMathCheck

      - name: Compilar APK Android
        working-directory: Camera2Diagnostico
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Publicar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: LuxCam-Pro-5.2-BETA-APK
          path: Camera2Diagnostico/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
