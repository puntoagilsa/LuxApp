name: Compilar LuxCam Pro 5.2.1 Seguro

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android 14
        run: sdkmanager --install 'platforms;android-34' 'build-tools;35.0.0'

      - name: Extraer fuente COMPLETA de LuxCam seguro
        shell: bash
        run: |
          set -euo pipefail
          test -f LuxCam_Pro_5_2_1_PROYECTO_COMPLETO.zip
          unzip -oq LuxCam_Pro_5_2_1_PROYECTO_COMPLETO.zip -d .
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxSmartPhoto.java
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxColorMath.java

      - name: Validar visor y modos fotografias seguros
        shell: bash
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('Camera2Diagnostico')
          s=(root/'app/src/main/java/com/altoke/camera2diagnostico/LuxCamActivity.java').read_text()
          assert 'b.set(CaptureRequest.TONEMAP_CURVE' not in s
          assert 'LuxSmartPhoto.enhance' in s
          ns='{http://schemas.android.com/apk/res/android}background'
          for folder in ['layout','layout-land']:
              p=root/'app/src/main/res'/folder/'activity_luxcam_studio.xml'
              v=[x for x in ET.parse(p).getroot().iter() if x.tag == 'TextureView']
              assert len(v)==1 and ns not in v[0].attrib
          print('OK: sin curvas ISP oscuras ni background TextureView')
          PYTEST

      - name: Pruebas Java de color y orientacion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luxcam-jvm"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/luxcam-jvm" \
            Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxColorMath.java \
            Camera2Diagnostico/checks/LuxColorMathCheck.java \
            Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/OrientationMath.java \
            Camera2Diagnostico/checks/OrientationMathCheck.java
          java -cp "$RUNNER_TEMP/luxcam-jvm" com.altoke.camera2diagnostico.LuxColorMathCheck
          java -cp "$RUNNER_TEMP/luxcam-jvm" com.altoke.camera2diagnostico.OrientationMathCheck

      - name: Compilar APK
        working-directory: Camera2Diagnostico
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxCam-Pro-5.2.1-Seguro-APK
          path: Camera2Diagnostico/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
