name: Compilar LuxCam Studio 5.1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Instalar Android 34
        run: sdkmanager --install 'platforms;android-34' 'build-tools;35.0.0'
      - name: Aplicar reparacion 5.1
        run: unzip -o LuxCam_Studio_v5_1_FIX_RAIZ_GITHUB.zip -d .
      - name: Tests Java de orientacion
        run: |
          mkdir -p "$RUNNER_TEMP/luxcam-tests"
          javac -d "$RUNNER_TEMP/luxcam-tests" \
            Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/OrientationMath.java \
            Camera2Diagnostico/checks/OrientationMathCheck.java
          java -cp "$RUNNER_TEMP/luxcam-tests" com.altoke.camera2diagnostico.OrientationMathCheck
      - name: Compilar APK
        working-directory: Camera2Diagnostico
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxCam-Studio-v5.1-APK
          path: Camera2Diagnostico/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
