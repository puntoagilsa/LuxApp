name: Compilar LuxCam Studio 5.1.1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android 34
        run: sdkmanager --install 'platforms;android-34' 'build-tools;35.0.0'

      - name: Aplicar proyecto completo 5.1.1
        shell: bash
        run: |
          test -f LuxCam_Studio_v5_1_1_BUNDLE_COMPLETO_RAIZ_GITHUB.zip
          unzip -oq LuxCam_Studio_v5_1_1_BUNDLE_COMPLETO_RAIZ_GITHUB.zip -d .
          test -f Camera2Diagnostico/settings.gradle
          test -f Camera2Diagnostico/app/build.gradle
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxCamActivity.java
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/OrientationMath.java
          test -f Camera2Diagnostico/checks/OrientationMathCheck.java
          test -f Camera2Diagnostico/app/src/main/res/layout/activity_luxcam_studio.xml
          test -f Camera2Diagnostico/app/src/main/res/layout-land/activity_luxcam_studio.xml
          echo 'Proyecto completo y archivos de orientacion presentes.'

      - name: Tests Java de orientacion
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/luxcam-tests"
          javac -d "$RUNNER_TEMP/luxcam-tests" \
            Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/OrientationMath.java \
            Camera2Diagnostico/checks/OrientationMathCheck.java
          java -cp "$RUNNER_TEMP/luxcam-tests" com.altoke.camera2diagnostico.OrientationMathCheck

      - name: Compilar APK
        working-directory: Camera2Diagnostico
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxCam-Studio-v5.1.1-APK
          path: Camera2Diagnostico/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
