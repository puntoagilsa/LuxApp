name: LuxCam Pro 5.2.2 - Corregir espejo frontal

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar SDK Android 14
        run: sdkmanager --install 'platforms;android-34' 'build-tools;35.0.0'

      - name: Extraer LuxCam completo
        shell: bash
        run: |
          set -euo pipefail
          test -f LuxCam_Pro_5_2_2_SIN_ESPEJO.zip
          unzip -oq LuxCam_Pro_5_2_2_SIN_ESPEJO.zip -d .
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxCamActivity.java
          test -f Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/OrientationMath.java

      - name: Verificar correccion de vista previa sin espejo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('Camera2Diagnostico')
          java = (root/'app/src/main/java/com/altoke/camera2diagnostico/LuxCamActivity.java').read_text(encoding='utf-8')
          gradle = (root/'app/build.gradle').read_text(encoding='utf-8')
          assert 'if (front) matrix.postScale(-1f, 1f, cx, cy);' not in java
          assert 'textureView.setTransform(matrix)' in java
          assert 'photo.set(CaptureRequest.JPEG_ORIENTATION, jpegOrientation());' in java
          assert 'beta522' in gradle
          ns = '{http://schemas.android.com/apk/res/android}background'
          for name in ('layout','layout-land'):
            layout = root/'app/src/main/res'/name/'activity_luxcam_studio.xml'
            textures = [x for x in ET.parse(layout).getroot().iter() if x.tag == 'TextureView']
            assert len(textures) == 1 and ns not in textures[0].attrib
          print('Verificacion OK: frontal sin espejo artificial; XML y orientacion de JPEG conservados')
          PYTEST

      - name: Pruebas Java
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/luxcam-tests"
          javac -encoding UTF-8 -d "$RUNNER_TEMP/luxcam-tests" \
            Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/OrientationMath.java \
            Camera2Diagnostico/checks/OrientationMathCheck.java \
            Camera2Diagnostico/app/src/main/java/com/altoke/camera2diagnostico/LuxColorMath.java \
            Camera2Diagnostico/checks/LuxColorMathCheck.java
          java -cp "$RUNNER_TEMP/luxcam-tests" com.altoke.camera2diagnostico.OrientationMathCheck
          java -cp "$RUNNER_TEMP/luxcam-tests" com.altoke.camera2diagnostico.LuxColorMathCheck

      - name: Compilar APK
        working-directory: Camera2Diagnostico
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LuxCam-5.2.2-Sin-Espejo-APK
          path: Camera2Diagnostico/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
